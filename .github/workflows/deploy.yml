name: CD - Deploy HealthMate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./HealthCare-Backend
          push: true
          tags: |
            talhah2005/health-care-backend:latest
            talhah2005/health-care-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./HealthCare-Frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            talhah2005/health-care-frontend:latest
            talhah2005/health-care-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            cd /opt/healthmate

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF

      - name: Verify production
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              https://healthmate-talha.duckdns.org/api/health; then

              echo ""
              echo "HealthMate deployment is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Production health check failed."
          exit 1
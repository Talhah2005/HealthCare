name: CI - Pull Request Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
                                               
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            HealthCare-Backend/package-lock.json
            HealthCare-Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./HealthCare-Backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: ./HealthCare-Backend
        run: node --check index.js

      - name: Install frontend dependencies
        working-directory: ./HealthCare-Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./HealthCare-Frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t healthcare-backend-ci ./HealthCare-Backend

      - name: Build frontend Docker image
        run: docker build -t healthcare-frontend-ci ./HealthCare-Frontend